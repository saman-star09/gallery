name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/satellite-ghost-gallery-qb9ujw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Supabase secrets are configured
        run: |
          missing=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL repository secret is missing or empty. Settings -> Secrets and variables -> Actions -> Secrets tab -> New repository secret."
            missing=1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY repository secret is missing or empty. Settings -> Secrets and variables -> Actions -> Secrets tab -> New repository secret."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::Add both as repository SECRETS (not Variables, not an Environment secret) with these exact names, then re-run this workflow."
            exit 1
          fi
          echo "Both Supabase env vars are present (${#VITE_SUPABASE_URL} / ${#VITE_SUPABASE_ANON_KEY} chars)."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
